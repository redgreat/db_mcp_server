name: Pre Docker Image CI

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            registry.cn-hangzhou.aliyuncs.com/${{ secrets.ALIYUN_NAMESPACE }}/${{ secrets.DOCKER_IMAGE_NAME }}:${{ github.ref_name }}
            registry.cn-hangzhou.aliyuncs.com/${{ secrets.ALIYUN_NAMESPACE }}/${{ secrets.DOCKER_IMAGE_NAME }}:latest
          # 缓解 npm 官方源在 CI 上偶发 ECONNRESET（默认 npmmirror；需官方源可改为 https://registry.npmjs.org）
          build-args: NPM_REGISTRY=https://registry.npmmirror.com
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 🔧 修复阿里云 ACR 推送报错：denied: unknown manifest class for application/vnd.oci.empty.v1+json
          # 新版 Buildx 默认生成 provenance/SBOM 证明（attestation）清单，其中含 OCI 空层
          # (application/vnd.oci.empty.v1+json)，阿里云 ACR 不支持该 manifest class 会拒绝接收。
          # 显式关闭默认 attestations 即可（仅影响推送清单，不影响镜像内容）。
          provenance: false
          sbom: false